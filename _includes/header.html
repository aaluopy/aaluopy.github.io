<header class="site-header">
  <div class="container">
    <div class="header-content">
      <a href="{{ "/" | relative_url }}" class="site-title">
        {{ site.title | escape }}
      </a>
      
      <nav class="site-nav">
        <a href="{{ "/" | relative_url }}" class="nav-link {% if page.url == '/' %}active{% endif %}">Home</a>
        <a href="{{ "/posts" | relative_url }}" class="nav-link {% if page.url == '/posts/' %}active{% endif %}">Posts</a>
        <a href="{{ "/categories" | relative_url }}" class="nav-link {% if page.url == '/categories/' %}active{% endif %}">Categories</a>
        <a href="{{ "/tags" | relative_url }}" class="nav-link {% if page.url == '/tags/' %}active{% endif %}">Tags</a>
        <a href="{{ "/about" | relative_url }}" class="nav-link {% if page.url == '/about/' %}active{% endif %}">About</a>
      </nav>
    </div>
  </div>
</header>
